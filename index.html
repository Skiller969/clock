<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/clock/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind-template</title>
    <style>
      body {
        scrollbar-width: none;
      }

      body::-webkit-scrollbar {
        display: none;
      }
    </style>
    <script type="module" crossorigin src="/clock/assets/index-DuNrRC0H.js"></script>
    <link rel="stylesheet" crossorigin href="/clock/assets/index-BfrXjLDg.css">
  </head>
  <body class="bg-gray-700 text-white flex justify-center items-center">
    <div
      class="min-h-screen flex flex-col items-center justify-center gap-5 md:gap-9"
    >
      <h1
        class="Title text-center text-3xl sm:text-5xl md:text-6xl font-bold px-4"
      >
        Indian Standard Time
      </h1>

      <div class="clock-container flex justify-center items-center">
        <div
          class="clock flex justify-center items-center p-8 md:p-20 border-2 border-black rounded-2xl text-3xl md:text-6xl shadow-xl"
        >
          <h1>00:00:00</h1>
        </div>
      </div>
      <p class="date text-2xl md:text-4xl"></p>
      <div
        class="option flex flex-col md:flex-row gap-4 md:gap-10 items-center text-3xl md:text-3xl justify-center"
      >
        <select name="select" id="select" class="text-2xl">
          <option value="india">india</option>
          <option value="usa">USA</option>
          <option value="japan">Japan</option>
        </select>

        <button
          class="btn border-2 border-gray-700 p-4 bg-gray-800 rounded-2xl focus:outline-2 focus:outline-offset-2 focus:outline-gray-400"
        >
          change country
        </button>
      </div>
    </div>
  </body>
</html>
